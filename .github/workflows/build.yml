name: Build WAYSS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor tools for OAuth bridge
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7

      - name: Patch Android OAuth support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/AppV3.tsx')
          s = p.read_text()
          if 'from"@capacitor/app"' not in s:
              s = s.replace('import Messages from "./Messages";', 'import Messages from "./Messages";\nimport{App}from"@capacitor/app";')
          old = 'async function google(){if(!supabase)return;const{error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin}});if(error)setAuthMsg(error.message)}'
          new = 'async function google(){if(!supabase)return;const native=window.location.protocol==="capacitor:"||window.location.protocol==="file:";const redirectTo=native?"wayss://auth/callback":window.location.origin;const{error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo}});if(error)setAuthMsg(error.message)}'
          if old not in s:
              raise SystemExit('Google login function was not found; refusing to build a partial patch.')
          s = s.replace(old,new,1)
          marker = ' useEffect(()=>{if(!supabase)return;supabase.auth.getSession().then(({data})=>setUser(data.session?.user||null));'
          bridge = ''' useEffect(()=>{let handle:any;void App.addListener("appUrlOpen",async({url})=>{try{const u=new URL(url);if(u.protocol!=="wayss:"||u.host!=="auth"||u.pathname!=="/callback")return;const code=u.searchParams.get("code");if(code)await supabase?.auth.exchangeCodeForSession(code)}catch(e){console.error("WAYSS OAuth callback error",e)}}).then(h=>{handle=h});return()=>{void handle?.remove()};},[]);
'''
          if 'WAYSS OAuth callback error' not in s:
              s = s.replace(marker, bridge + marker, 1)
          p.write_text(s)
          PY

      - name: Build WAYSS web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wayss.social",
            "appName": "WAYSS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Generate Android project
        run: npx cap add android

      - name: Add WAYSS OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '</activity>'
          intent = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="wayss" android:host="auth" android:pathPrefix="/callback" />
              </intent-filter>
          '''
          if 'android:scheme="wayss"' not in s:
              s = s.replace(marker, intent + '\n        ' + marker, 1)
              p.write_text(s)
          PY

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wayss-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayss-web-build
          path: dist
          if-no-files-found: error
          retention-days: 14
