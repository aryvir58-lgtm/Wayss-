name: Build WAYSS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: wayss-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor OAuth tools
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7

      - name: Patch WAYSS Android OAuth
        run: node scripts/patch-oauth.mjs

      - name: Build WAYSS web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wayss.social",
            "appName": "WAYSS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Generate Android project
        run: npx cap add android

      - name: Add WAYSS OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          intent = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="wayss" android:host="auth" android:pathPrefix="/callback" />
              </intent-filter>
          '''
          if 'android:scheme="wayss"' not in s:
              s = s.replace('</activity>', intent + '\n        </activity>', 1)
              p.write_text(s)
          PY

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest "$APK_PATH#wayss.apk" \
              --title "WAYSS Latest APK" \
              --notes "Latest successful WAYSS Android build. Download wayss.apk and install it on your Android phone." \
              --target "$GITHUB_SHA"
          else
            gh release upload latest "$APK_PATH#wayss.apk" --clobber
            gh release edit latest --title "WAYSS Latest APK" --notes "Latest successful WAYSS Android build. Download wayss.apk and install it on your Android phone." --latest
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wayss-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayss-web-build
          path: dist
          if-no-files-found: error
          retention-days: 14
