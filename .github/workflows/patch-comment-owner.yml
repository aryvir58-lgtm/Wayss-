name: Patch comment owner controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch comment delete permission in UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppV3.tsx')
          s=p.read_text()
          old='c.author_id===user?.id&&<button className="icon"onClick={()=>remove(c.id)}>'
          new='(c.author_id===user?.id||post.author_id===user?.id)&&<button className="icon"onClick={()=>remove(c.id)}>'
          if old not in s:
              print('already patched or pattern missing')
              raise SystemExit(0)
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV3.tsx
          git diff --cached --quiet || git commit -m "Allow post owners to delete comments"
          git push
