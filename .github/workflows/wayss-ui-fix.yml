name: WAYSS UI Fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch AppV3
        run: python tools/patch_ui.py
      - name: Commit and push
        run: |
          git config user.name "wayss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/AppV3.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "WAYSS: fix settings messages orbit"
          git push
